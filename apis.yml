aid: charter-space
name: Charter Space
description: >-
  Charter Space is a London-based space technology company, founded in 2021,
  building software and financial infrastructure for the New Space economy. Its
  flagship product, Ubik, is a browser-native, model-based systems engineering
  and program management platform that unifies requirements management, project
  management, block diagrams, test procedures, and scheduling in a single
  collaborative environment, cutting manual systems-engineering admin for
  spacecraft programs. Ubik is in beta with organizations including teams at
  NASA's Jet Propulsion Laboratory and exposes native integrations (OneDrive,
  Google Drive, Jira, GitHub) plus an API for connecting specialized tooling.
  Charter has also expanded into space insurance, capturing manufacturing and
  test data at the source to feed an underwriting interface tied to the largest
  space-insurance carriers, and operates an insurance brokerage for New Space
  companies insuring satellites and spacecraft. Backed by Techstars and Capital
  Factory.
